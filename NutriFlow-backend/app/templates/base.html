<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>{{ plan.patient_name }} — NutriFlow</title>
  <style>{% include "shared.css" %}</style>
  <style>{% include "layouts/" ~ layout.id ~ "/styles.css" %}</style>
  <style>
    :root {
      --primary: {{ theme.primary }};
      --secondary: {{ theme.secondary }};
      --dark: {{ theme.dark }};
      --soft: {{ theme.soft }};
      --tint: {{ theme.tint }};
    }
  </style>
</head>
<body class="layout-{{ layout.id }}">
  {% block content %}{% endblock %}
</body>
</html>
